{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6 col-lg-5">
    <div class="confirm-card card p-4">
      <h1 class="mb-2">Excluir Jogo</h1>
      <p class="confirm-text">Tem certeza que deseja excluir <strong>"{{ object.nome }}"</strong>? Essa ação não pode ser desfeita.</p>

      <form method="post" class="mb-2 mt-3">
          {% csrf_token %}
          <button type="submit" class="btn btn-outline-dark w-100">Confirmar exclusão</button>
      </form>

      <a href="{% url 'jogos:detalhe' object.pk %}" class="d-block text-center">Cancelar</a>
    </div>
  </div>
</div>
{% endblock %}
