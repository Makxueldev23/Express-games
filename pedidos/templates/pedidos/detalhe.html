{% extends "base.html" %}

{% block content %}
<h1>Pedido #{{ pedido.pk }}</h1>
<p>Status: {{ pedido.status }}</p>

<ul>
{% for item in pedido.itens.all %}
    <li>{{ item.quantidade }}x {{ item.jogo.nome }} — R$ {{ item.subtotal }}</li>
{% endfor %}
</ul>

<p><strong>Total: R$ {{ pedido.total }}</strong></p>

<a href="{% url 'pedidos:lista' %}">Voltar</a>
{% endblock %}
