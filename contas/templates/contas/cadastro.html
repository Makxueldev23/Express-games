{% extends 'contas/base.html' %}

{% block title %}Cadastro{% endblock %}

{% block content %}

<h1>Criar conta</h1>

<form method="POST">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Cadastrar
    </button>
</form>

<p>
    Já possui uma conta?
    <a href="{% url 'contas:login' %}">
        Entrar
    </a>
</p>

{% endblock %}
