{% extends 'contas/base.html' %}

{% block title %}Login{% endblock %}

{% block content %}

<h1>Entrar</h1>

<form method="POST">
    {% csrf_token %}

    <label for="username">
        Usuário:
    </label>

    <input
        type="text"
        name="username"
        id="username"
        required
    >

    <br><br>

    <label for="password">
        Senha:
    </label>

    <input
        type="password"
        name="password"
        id="password"
        required
    >

    <br><br>

    <button type="submit">
        Entrar
    </button>
</form>

<p>
    Não possui uma conta?
    <a href="{% url 'contas:cadastro' %}">
        Cadastre-se
    </a>
</p>

{% endblock %}
