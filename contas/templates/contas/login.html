{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-7 col-lg-5">
    <div class="auth-card card p-4">
      <h1 class="mb-1">Entrar</h1>
      <p class="auth-subtitle mb-4">Acesse sua conta para comprar e ver seus pedidos.</p>

      {% if messages %}
        {% for message in messages %}<p class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</p>{% endfor %}
      {% endif %}

      <form method="post" class="mb-3">
          {% csrf_token %}
          <div class="mb-3">
              <label class="form-label">Usuário:</label>
              <input type="text" name="username" class="form-control">
          </div>
          <div class="mb-3">
              <label class="form-label">Senha:</label>
              <input type="password" name="password" class="form-control">
          </div>
          <button type="submit" class="btn btn-primary w-100">Entrar</button>
      </form>

      <p class="auth-footer-text mb-0">Não tem conta? <a href="{% url 'contas:cadastro' %}">Criar conta</a></p>
    </div>
  </div>
</div>
{% endblock %}
