{% extends 'contas/base.html' %}

{% block title %}Editar Perfil{% endblock %}

{% block content %}

<h1>Editar Perfil</h1>

<form method="POST">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Salvar alterações
    </button>
</form>

<br>

<a href="{% url 'contas:perfil' %}">
    Voltar para o perfil
</a>

{% endblock %}
